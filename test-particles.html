<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle System Test</title>
    <style>
        body { margin: 0; background: #0a0e1a; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100vh; }
        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00d4ff;
            font-family: monospace;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="info">
        🔥 Particle System Test<br>
        Move your mouse around to interact!
    </div>
    <canvas id="hero-canvas"></canvas>
    <script src="js/core/particles.js"></script>
    <script>
        const canvas = document.getElementById('hero-canvas');
        const particles = new ParticleSystem(canvas);
        console.log('✨ Particle System loaded!', particles);
    </script>
</body>
</html>

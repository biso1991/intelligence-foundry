<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Architecture Studio | Bilel Nasri - Intelligence Foundry</title>
    <meta name="description" content="Interactive visualization of Intelligence Platform architecture - from data ingestion to production AI systems">
    
    <!-- Design System -->
    <link rel="stylesheet" href="css/design-tokens.css?v=2.0.0">
    <link rel="stylesheet" href="css/animations.css?v=2.0.0">
    <link rel="stylesheet" href="css/components.css?v=2.0.0">
    
    <style>
        /* === ARCHITECTURE STUDIO STYLES === */
        
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-body);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        
        .studio-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: var(--space-8) var(--space-6);
        }
        
        /* Header */
        .studio-header {
            text-align: center;
            margin-bottom: var(--space-12);
            padding: var(--space-8) 0;
            border-bottom: 1px solid var(--border-subtle);
        }
        
        .studio-title {
            font-size: var(--text-5xl);
            font-weight: var(--font-bold);
            background: linear-gradient(135deg, var(--flow-cyan) 0%, var(--flow-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: var(--space-3);
        }
        
        .studio-subtitle {
            font-size: var(--text-xl);
            color: var(--text-secondary);
            margin-bottom: var(--space-6);
        }
        
        .studio-stats {
            display: flex;
            justify-content: center;
            gap: var(--space-8);
            flex-wrap: wrap;
            margin-top: var(--space-6);
        }
        
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--space-1);
        }
        
        .stat-value {
            font-size: var(--text-3xl);
            font-weight: var(--font-bold);
            color: var(--accent-primary);
        }
        
        .stat-label {
            font-size: var(--text-sm);
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        /* Scenario Controls */
        .scenario-controls {
            display: flex;
            justify-content: center;
            gap: var(--space-3);
            flex-wrap: wrap;
            margin-bottom: var(--space-8);
            padding: var(--space-6);
            background: var(--bg-surface);
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-medium);
        }
        
        .scenario-btn {
            padding: var(--space-3) var(--space-6);
            background: var(--bg-surface-elevated);
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-lg);
            color: var(--text-secondary);
            font-size: var(--text-sm);
            font-weight: var(--font-medium);
            cursor: pointer;
            transition: all var(--duration-base);
            white-space: nowrap;
        }
        
        .scenario-btn:hover {
            border-color: var(--accent-primary);
            color: var(--text-primary);
            transform: translateY(-2px);
        }
        
        .scenario-btn.active {
            background: var(--accent-primary);
            color: var(--bg-primary);
            border-color: var(--accent-primary);
        }
        
        /* Legend */
        .legend {
            display: flex;
            justify-content: center;
            gap: var(--space-6);
            flex-wrap: wrap;
            margin-bottom: var(--space-6);
            padding: var(--space-4);
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-subtle);
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            font-size: var(--text-sm);
        }
        
        .legend-icon {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        
        .legend-icon.professional { background: var(--flow-green); }
        .legend-icon.personal { background: var(--flow-cyan); }
        .legend-icon.familiarity { background: var(--text-tertiary); }
        
        /* SVG Container */
        .svg-container {
            background: var(--bg-surface);
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-xl);
            padding: var(--space-6);
            overflow-x: auto;
            margin-bottom: var(--space-8);
            position: relative;
        }
        
        #architecture-svg {
            width: 100%;
            height: auto;
            min-height: 600px;
        }
        
        /* Canvas Overlay */
        #particle-canvas {
            position: absolute;
            top: var(--space-6);
            left: var(--space-6);
            pointer-events: none;
            z-index: 1;
        }
        
        /* SVG Elements */
        .node-group {
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .node-group.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .node-circle {
            transition: all 0.2s ease;
        }
        
        .node-group:hover .node-circle {
            stroke-width: 3;
            filter: drop-shadow(0 0 8px currentColor);
        }
        
        .node-label {
            font-size: 12px;
            fill: var(--text-primary);
            text-anchor: middle;
            pointer-events: none;
            user-select: none;
        }
        
        .node-icon {
            font-size: 20px;
            text-anchor: middle;
            dominant-baseline: middle;
            pointer-events: none;
            user-select: none;
        }
        
        .connection-line {
            transition: all 0.2s ease;
        }
        
        .connection-line.hidden {
            opacity: 0;
        }
        
        .connection-line.streaming {
            stroke-dasharray: 8 4;
        }
        
        .connection-line.lookup {
            stroke-dasharray: 2 3;
        }
        
        .connection-line.telemetry {
            stroke-width: 1;
            opacity: 0.4;
        }
        
        .connection-line.deployment {
            stroke-width: 3;
        }
        
        .layer-label {
            font-size: 14px;
            font-weight: var(--font-semibold);
            fill: var(--text-tertiary);
            text-anchor: middle;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .studio-title {
                font-size: var(--text-3xl);
            }
            
            .studio-subtitle {
                font-size: var(--text-base);
            }
            
            .scenario-controls {
                flex-direction: column;
            }
            
            .scenario-btn {
                width: 100%;
            }
            
            .svg-container {
                padding: var(--space-3);
            }
        }
        
        /* Loading State */
        .loading {
            text-align: center;
            padding: var(--space-16);
            color: var(--text-secondary);
        }
        
        .loading-spinner {
            border: 3px solid var(--border-medium);
            border-top: 3px solid var(--accent-primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto var(--space-4);
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Animation Controls */
        .animation-controls {
            display: flex;
            justify-content: center;
            gap: var(--space-3);
            margin-bottom: var(--space-6);
            padding: var(--space-4);
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-subtle);
        }
        
        .animation-btn {
            padding: var(--space-2) var(--space-4);
            background: var(--bg-surface-elevated);
            border: 1px solid var(--border-medium);
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            font-size: var(--text-sm);
            font-weight: var(--font-medium);
            cursor: pointer;
            transition: all var(--duration-base);
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }
        
        .animation-btn:hover {
            border-color: var(--accent-primary);
            color: var(--text-primary);
        }
        
        .animation-btn.active {
            background: var(--accent-primary);
            color: var(--bg-primary);
            border-color: var(--accent-primary);
        }
        
        .animation-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="studio-container">
        <!-- Header -->
        <header class="studio-header">
            <h1 class="studio-title">System Architecture Studio</h1>
            <p class="studio-subtitle">Intelligence Platform — From Data to AI</p>
            
            <div class="studio-stats">
                <div class="stat-item">
                    <div class="stat-value" id="stat-nodes">36</div>
                    <div class="stat-label">Components</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="stat-connections">37</div>
                    <div class="stat-label">Connections</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="stat-layers">8</div>
                    <div class="stat-label">Layers</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="stat-scenarios">5</div>
                    <div class="stat-label">Scenarios</div>
                </div>
            </div>
        </header>
        
        <!-- Scenario Controls -->
        <div class="scenario-controls" id="scenario-controls">
            <!-- Dynamically populated -->
        </div>
        
        <!-- Legend -->
        <div class="legend">
            <div class="legend-item">
                <div class="legend-icon professional"></div>
                <span>Professional (UBIAI Internship)</span>
            </div>
            <div class="legend-item">
                <div class="legend-icon personal"></div>
                <span>Personal Projects</span>
            </div>
            <div class="legend-item">
                <div class="legend-icon familiarity"></div>
                <span>Architecture Familiarity</span>
            </div>
        </div>
        
        <!-- Animation Controls -->
        <div class="animation-controls">
            <button class="animation-btn active" id="btn-play" aria-label="Play animation">
                <span>▶</span> Play
            </button>
            <button class="animation-btn" id="btn-pause" aria-label="Pause animation">
                <span>⏸</span> Pause
            </button>
            <button class="animation-btn" id="btn-replay" aria-label="Replay animation">
                <span>↻</span> Replay
            </button>
        </div>
        
        <!-- SVG Visualization -->
        <div class="svg-container" id="viz-container">
            <canvas id="particle-canvas"></canvas>
            <svg id="architecture-svg" viewBox="0 0 2000 700" preserveAspectRatio="xMidYMid meet">
                <!-- Dynamically populated -->
            </svg>
        </div>
        
        <!-- Loading State -->
        <div class="loading" id="loading">
            <div class="loading-spinner"></div>
            <p>Loading architecture configuration...</p>
        </div>
    </div>
    
    <!-- Architecture Configuration -->
    <script type="module">
        import { intelligencePlatform, validateArchitecture } from './js/architecture-studio/architectures/intelligence-platform.js';
        
        // Validate configuration
        const validation = validateArchitecture(intelligencePlatform);
        if (!validation.valid) {
            console.error('Architecture validation failed:', validation.errors);
            document.getElementById('loading').innerHTML = `
                <h2 style="color: var(--error)">Configuration Error</h2>
                <p>${validation.errors.join('<br>')}</p>
            `;
            throw new Error('Invalid architecture configuration');
        }
        
        console.log('✅ Architecture validation passed:', validation.counts);
        
        // Hide loading
        document.getElementById('loading').style.display = 'none';
        
        // === CONFIGURATION ===
        const LAYER_WIDTH = 240;
        const LAYER_PADDING = 20;
        const NODE_VERTICAL_SPACING = 80;
        const LAYER_START_X = 50;
        const LAYER_START_Y = 80;
        
        const LAYER_ORDER = ['sources', 'ingestion', 'processing', 'storage', 'ml', 'ai', 'production', 'observability'];
        
        const EXPERIENCE_COLORS = {
            'professional': '#10b981',       // Green (UBIAI)
            'personal-project': '#00d4ff',   // Cyan (Personal)
            'architecture-familiarity': '#64748b' // Gray (Familiarity)
        };
        
        // === LAYOUT CALCULATION ===
        function calculateNodePositions(nodes) {
            const nodesByLayer = {};
            
            // Group nodes by layer
            nodes.forEach(node => {
                if (!nodesByLayer[node.layer]) {
                    nodesByLayer[node.layer] = [];
                }
                nodesByLayer[node.layer].push(node);
            });
            
            // Calculate positions
            const positions = new Map();
            
            LAYER_ORDER.forEach((layer, layerIndex) => {
                const layerNodes = nodesByLayer[layer] || [];
                const layerX = LAYER_START_X + (layerIndex * LAYER_WIDTH);
                
                layerNodes.forEach((node, nodeIndex) => {
                    const y = LAYER_START_Y + (nodeIndex * NODE_VERTICAL_SPACING);
                    positions.set(node.id, { x: layerX, y: y });
                });
            });
            
            return positions;
        }
        
        // === SVG RENDERING ===
        const svg = document.getElementById('architecture-svg');
        const positions = calculateNodePositions(intelligencePlatform.nodes);
        
        // Store references for scenario filtering
        const nodeElements = new Map();
        const connectionElements = new Map();
        
        // Render connections first (so they appear behind nodes)
        function renderConnections() {
            const connectionsGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            connectionsGroup.id = 'connections-layer';
            
            intelligencePlatform.connections.forEach((conn, index) => {
                const fromPos = positions.get(conn.from);
                const toPos = positions.get(conn.to);
                
                if (!fromPos || !toPos) {
                    console.warn(`Missing position for connection: ${conn.from} -> ${conn.to}`);
                    return;
                }
                
                // Calculate curve control points
                const dx = toPos.x - fromPos.x;
                const dy = toPos.y - fromPos.y;
                const cx1 = fromPos.x + dx * 0.5;
                const cy1 = fromPos.y;
                const cx2 = fromPos.x + dx * 0.5;
                const cy2 = toPos.y;
                
                // Create path
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', `M ${fromPos.x} ${fromPos.y} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${toPos.x} ${toPos.y}`);
                path.setAttribute('stroke', '#3b82f6');
                path.setAttribute('stroke-width', '2');
                path.setAttribute('fill', 'none');
                path.setAttribute('opacity', '0.3');
                path.classList.add('connection-line', conn.type);
                path.id = `conn-${conn.from}-${conn.to}`;
                
                connectionsGroup.appendChild(path);
                connectionElements.set(`${conn.from}-${conn.to}`, path);
            });
            
            svg.appendChild(connectionsGroup);
        }
        
        // Render layer labels
        function renderLayerLabels() {
            const labelsGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            labelsGroup.id = 'layer-labels';
            
            LAYER_ORDER.forEach((layer, index) => {
                const x = LAYER_START_X + (index * LAYER_WIDTH);
                const y = 30;
                
                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', x);
                text.setAttribute('y', y);
                text.classList.add('layer-label');
                text.textContent = layer;
                
                labelsGroup.appendChild(text);
            });
            
            svg.appendChild(labelsGroup);
        }
        
        // Render nodes
        function renderNodes() {
            const nodesGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            nodesGroup.id = 'nodes-layer';
            
            intelligencePlatform.nodes.forEach(node => {
                const pos = positions.get(node.id);
                if (!pos) {
                    console.warn(`Missing position for node: ${node.id}`);
                    return;
                }
                
                // Create group for node
                const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                group.classList.add('node-group');
                group.id = `node-${node.id}`;
                group.setAttribute('data-experience', node.experience);
                
                // Circle
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', pos.x);
                circle.setAttribute('cy', pos.y);
                circle.setAttribute('r', node.size || 30);
                circle.setAttribute('fill', node.color || EXPERIENCE_COLORS[node.experience]);
                circle.setAttribute('stroke', EXPERIENCE_COLORS[node.experience]);
                circle.setAttribute('stroke-width', '2');
                circle.setAttribute('opacity', '0.8');
                circle.classList.add('node-circle');
                
                // Icon
                const icon = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                icon.setAttribute('x', pos.x);
                icon.setAttribute('y', pos.y + 2);
                icon.classList.add('node-icon');
                icon.textContent = node.icon || '⚙';
                
                // Label (below node)
                const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                label.setAttribute('x', pos.x);
                label.setAttribute('y', pos.y + (node.size || 30) + 20);
                label.classList.add('node-label');
                label.textContent = node.name;
                
                group.appendChild(circle);
                group.appendChild(icon);
                group.appendChild(label);
                
                nodesGroup.appendChild(group);
                nodeElements.set(node.id, group);
            });
            
            svg.appendChild(nodesGroup);
        }
        
        // === SCENARIO SWITCHING ===
        function renderScenarioControls() {
            const controls = document.getElementById('scenario-controls');
            
            Object.entries(intelligencePlatform.scenarios).forEach(([key, scenario]) => {
                const button = document.createElement('button');
                button.classList.add('scenario-btn');
                button.textContent = scenario.name;
                button.dataset.scenario = key;
                
                if (key === 'complete') {
                    button.classList.add('active');
                }
                
                button.addEventListener('click', () => {
                    // Update active button
                    document.querySelectorAll('.scenario-btn').forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                    
                    // Apply scenario
                    activateScenario(key);
                });
                
                controls.appendChild(button);
            });
        }
        
        function activateScenario(scenarioKey) {
            const scenario = intelligencePlatform.scenarios[scenarioKey];
            
            // Determine active nodes
            const activeNodes = scenario.activeNodes === 'all'
                ? new Set(intelligencePlatform.nodes.map(n => n.id))
                : new Set(scenario.activeNodes);
            
            // Show/hide nodes
            intelligencePlatform.nodes.forEach(node => {
                const element = nodeElements.get(node.id);
                if (element) {
                    if (activeNodes.has(node.id)) {
                        element.classList.remove('hidden');
                    } else {
                        element.classList.add('hidden');
                    }
                }
            });
            
            // Show/hide connections
            intelligencePlatform.connections.forEach(conn => {
                const element = connectionElements.get(`${conn.from}-${conn.to}`);
                if (element) {
                    const visible = activeNodes.has(conn.from) && activeNodes.has(conn.to);
                    if (visible) {
                        element.classList.remove('hidden');
                    } else {
                        element.classList.add('hidden');
                    }
                }
            });
            
            console.log(`Activated scenario: ${scenario.name}`);
        }
        
        // === INITIALIZATION ===
        function init() {
            renderLayerLabels();
            renderConnections();
            renderNodes();
            renderScenarioControls();
            
            console.log('✅ Architecture Studio initialized');
            console.log(`Rendered ${intelligencePlatform.nodes.length} nodes and ${intelligencePlatform.connections.length} connections`);
        }
        
        init();
        
        // === CANVAS PARTICLE ANIMATION SYSTEM ===
        
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d', { alpha: true });
        const svg = document.getElementById('architecture-svg');
        const container = document.getElementById('viz-container');
        
        // Animation state
        let animationState = {
            isPlaying: true,
            isPaused: false,
            animationFrameId: null,
            particles: [],
            lastTime: 0
        };
        
        // Check for reduced motion preference
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        
        // Particle class
        class Particle {
            constructor(connection, positions) {
                this.connection = connection;
                this.fromPos = positions.get(connection.from);
                this.toPos = positions.get(connection.to);
                
                if (!this.fromPos || !this.toPos) {
                    this.valid = false;
                    return;
                }
                
                this.valid = true;
                this.progress = Math.random(); // Random start position
                this.speed = this.getSpeedForType(connection.type);
                this.size = this.getSizeForType(connection.type);
                this.color = this.getColorForType(connection.type);
                this.opacity = 0.6;
            }
            
            getSpeedForType(type) {
                switch(type) {
                    case 'streaming': return 0.008; // Fast (real-time)
                    case 'batch': return 0.004;     // Medium (scheduled)
                    case 'lookup': return 0.012;    // Very fast (queries)
                    case 'telemetry': return 0.006; // Medium-fast (monitoring)
                    case 'deployment': return 0.003; // Slow (deliberate)
                    default: return 0.005;
                }
            }
            
            getSizeForType(type) {
                switch(type) {
                    case 'streaming': return 4;
                    case 'batch': return 5;
                    case 'lookup': return 3;
                    case 'telemetry': return 2;
                    case 'deployment': return 6;
                    default: return 4;
                }
            }
            
            getColorForType(type) {
                switch(type) {
                    case 'streaming': return '#00d4ff'; // Cyan
                    case 'batch': return '#8b5cf6';     // Purple
                    case 'lookup': return '#10b981';    // Green
                    case 'telemetry': return '#f59e0b'; // Amber
                    case 'deployment': return '#3b82f6'; // Blue
                    default: return '#00d4ff';
                }
            }
            
            update(deltaTime) {
                if (!this.valid) return false;
                
                // Move along connection path
                this.progress += this.speed * (deltaTime / 16); // Normalize to 60fps baseline
                
                // Reset when reaching end
                if (this.progress >= 1) {
                    this.progress = 0;
                }
                
                return true;
            }
            
            draw(ctx, dpr) {
                if (!this.valid) return;
                
                // Calculate position along Bezier curve
                const t = this.progress;
                const t1 = 1 - t;
                
                // Control points for Bezier curve (matching SVG connections)
                const dx = this.toPos.x - this.fromPos.x;
                const cx1 = this.fromPos.x + dx * 0.5;
                const cy1 = this.fromPos.y;
                const cx2 = this.fromPos.x + dx * 0.5;
                const cy2 = this.toPos.y;
                
                // Cubic Bezier formula
                const x = Math.pow(t1, 3) * this.fromPos.x +
                         3 * Math.pow(t1, 2) * t * cx1 +
                         3 * t1 * Math.pow(t, 2) * cx2 +
                         Math.pow(t, 3) * this.toPos.x;
                         
                const y = Math.pow(t1, 3) * this.fromPos.y +
                         3 * Math.pow(t1, 2) * t * cy1 +
                         3 * t1 * Math.pow(t, 2) * cy2 +
                         Math.pow(t, 3) * this.toPos.y;
                
                // Draw particle
                ctx.save();
                ctx.globalAlpha = this.opacity;
                
                // Glow effect
                const gradient = ctx.createRadialGradient(x * dpr, y * dpr, 0, x * dpr, y * dpr, this.size * dpr * 2);
                gradient.addColorStop(0, this.color);
                gradient.addColorStop(0.5, this.color + '80');
                gradient.addColorStop(1, this.color + '00');
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(x * dpr, y * dpr, this.size * dpr * 2, 0, Math.PI * 2);
                ctx.fill();
                
                // Core particle
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(x * dpr, y * dpr, this.size * dpr, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
        }
        
        // Setup canvas dimensions
        function setupCanvas() {
            const svgRect = svg.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            
            // Set canvas size to match SVG
            canvas.width = svgRect.width * dpr;
            canvas.height = svgRect.height * dpr;
            canvas.style.width = svgRect.width + 'px';
            canvas.style.height = svgRect.height + 'px';
            
            // Scale context to match device pixel ratio
            ctx.scale(dpr, dpr);
        }
        
        // Initialize particles for active connections
        function initializeParticles() {
            animationState.particles = [];
            
            // Get active scenario
            const activeScenarioBtn = document.querySelector('.scenario-btn.active');
            const activeScenarioKey = activeScenarioBtn ? 
                Object.keys(intelligencePlatform.scenarios).find(key => 
                    intelligencePlatform.scenarios[key].name === activeScenarioBtn.textContent.trim()
                ) : 'complete';
            
            const scenario = intelligencePlatform.scenarios[activeScenarioKey];
            const activeNodes = scenario.activeNodes === 'all'
                ? new Set(intelligencePlatform.nodes.map(n => n.id))
                : new Set(scenario.activeNodes);
            
            // Create particles for visible connections
            intelligencePlatform.connections.forEach(conn => {
                // Only create particles for connections where both endpoints are visible
                if (activeNodes.has(conn.from) && activeNodes.has(conn.to)) {
                    // Particle density based on connection type
                    const particleCount = getParticleCount(conn.type);
                    
                    for (let i = 0; i < particleCount; i++) {
                        const particle = new Particle(conn, positions);
                        if (particle.valid) {
                            // Stagger particles along the connection
                            particle.progress = i / particleCount;
                            animationState.particles.push(particle);
                        }
                    }
                }
            });
            
            console.log(`Initialized ${animationState.particles.length} particles for scenario: ${activeScenarioKey}`);
        }
        
        function getParticleCount(connectionType) {
            switch(connectionType) {
                case 'streaming': return 3;  // High traffic
                case 'batch': return 2;       // Medium traffic
                case 'lookup': return 4;      // Very high traffic
                case 'telemetry': return 1;   // Low traffic
                case 'deployment': return 1;  // Low traffic
                default: return 2;
            }
        }
        
        // Animation loop
        function animate(currentTime) {
            if (!animationState.isPlaying) return;
            
            const deltaTime = currentTime - animationState.lastTime;
            animationState.lastTime = currentTime;
            
            // Clear canvas
            const dpr = window.devicePixelRatio || 1;
            ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
            
            // Update and draw particles
            if (!animationState.isPaused) {
                animationState.particles.forEach(particle => {
                    particle.update(deltaTime);
                    particle.draw(ctx, 1); // Pass 1 as dpr since we already scaled the context
                });
            } else {
                // Still draw particles when paused, just don't update positions
                animationState.particles.forEach(particle => {
                    particle.draw(ctx, 1);
                });
            }
            
            animationState.animationFrameId = requestAnimationFrame(animate);
        }
        
        // Animation controls
        function startAnimation() {
            if (animationState.isPlaying) return;
            
            animationState.isPlaying = true;
            animationState.isPaused = false;
            animationState.lastTime = performance.now();
            animationState.animationFrameId = requestAnimationFrame(animate);
            
            updateControlButtons();
        }
        
        function pauseAnimation() {
            animationState.isPaused = true;
            updateControlButtons();
        }
        
        function resumeAnimation() {
            animationState.isPaused = false;
            animationState.lastTime = performance.now();
            updateControlButtons();
        }
        
        function replayAnimation() {
            // Stop current animation
            if (animationState.animationFrameId) {
                cancelAnimationFrame(animationState.animationFrameId);
            }
            
            // Reset state
            animationState.isPlaying = false;
            animationState.isPaused = false;
            
            // Re-initialize particles
            initializeParticles();
            
            // Start fresh
            startAnimation();
        }
        
        function stopAnimation() {
            animationState.isPlaying = false;
            if (animationState.animationFrameId) {
                cancelAnimationFrame(animationState.animationFrameId);
                animationState.animationFrameId = null;
            }
        }
        
        function updateControlButtons() {
            const playBtn = document.getElementById('btn-play');
            const pauseBtn = document.getElementById('btn-pause');
            
            playBtn.classList.toggle('active', !animationState.isPaused && animationState.isPlaying);
            pauseBtn.classList.toggle('active', animationState.isPaused);
        }
        
        // Setup animation controls
        document.getElementById('btn-play').addEventListener('click', () => {
            if (animationState.isPaused) {
                resumeAnimation();
            } else {
                startAnimation();
            }
        });
        
        document.getElementById('btn-pause').addEventListener('click', () => {
            if (animationState.isPlaying && !animationState.isPaused) {
                pauseAnimation();
            }
        });
        
        document.getElementById('btn-replay').addEventListener('click', () => {
            replayAnimation();
        });
        
        // Handle window resize
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                setupCanvas();
                // Particles maintain their progress, just redraw at new size
            }, 150);
        });
        
        // Handle page visibility changes
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                // Pause animation when tab is not visible
                if (animationState.isPlaying && !animationState.isPaused) {
                    animationState.isPaused = true;
                }
            } else {
                // Resume animation when tab becomes visible
                if (animationState.isPlaying && animationState.isPaused) {
                    animationState.isPaused = false;
                    animationState.lastTime = performance.now();
                }
            }
        });
        
        // Override scenario switching to reinitialize particles
        const originalActivateScenario = activateScenario;
        activateScenario = function(scenarioKey) {
            originalActivateScenario(scenarioKey);
            
            // Reinitialize particles for new scenario
            if (animationState.isPlaying) {
                stopAnimation();
                initializeParticles();
                startAnimation();
            }
        };
        
        // Initialize canvas and animation
        setupCanvas();
        
        if (!prefersReducedMotion) {
            initializeParticles();
            startAnimation();
        } else {
            console.log('Animation disabled: user prefers reduced motion');
            // Hide animation controls
            document.querySelector('.animation-controls').style.display = 'none';
        }
    </script>
</body>
</html>
